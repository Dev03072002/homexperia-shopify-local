# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# The tracked production Shopify configuration, and the only config in this
# repository. Controlled releases name it explicitly:
#   shopify app deploy --config production
#
# The production client_id below is committed on purpose. Shopify documents it
# as the app's public identifier and a required field; leaving it out made the
# CLI treat the config as unlinked and pull Dev Dashboard defaults over it at
# release time. Do not reintroduce SHOPIFY_FLAG_CLIENT_ID.
#
# For local work use your own gitignored shopify.app.<name>.toml via
# `shopify app config link`, then `shopify app config use <name>`.

name = "Homexperia Room Visualisation"
handle = "homexperia-room-visualisation"
client_id = "3a2e564ef8597b0c509b6cb60d7b1954"
application_url = "https://online.homexperia.com"
embedded = true

[access_scopes]
# Must stay byte-identical to the SCOPES runtime variable.
# app/shopify.server.ts splits SCOPES on "," without trimming.
scopes = "write_products,unauthenticated_read_product_listings,unauthenticated_read_product_inventory,unauthenticated_read_product_tags,unauthenticated_read_product_pickup_locations,unauthenticated_read_metaobjects"

[webhooks]
# 2026-07 matches ApiVersion.July26 in app/shopify.server.ts. Keeping the
# webhook serialization version aligned with the Admin API client avoids
# payloads arriving in a shape the handlers were not written against.
api_version = "2026-07"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  # Triggers Storefront token regeneration when granted scopes change.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory compliance topics for public apps. These use `compliance_topics`,
  # not `topics`. Missing or non-conforming handlers are an App Store rejection.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
# Path matches authPathPrefix "/auth" in app/shopify.server.ts, served by the
# splat route app/routes/auth.$.tsx.
redirect_urls = [ "https://online.homexperia.com/auth/callback" ]

[build]

# Critical for this file: it points at the REAL production app. If this were
# true, running `shopify app dev --config production` would overwrite the
# production application_url and redirect_urls with a temporary tunnel and break
# OAuth for every installed merchant.
automatically_update_urls_on_dev = false

# Merchant-facing per-product switch to hide the storefront widget.
#
# Declared here so Shopify owns the definition: deploying the app creates it, and
# no afterAuth/Admin API call is needed. The namespace is the reserved $app
# prefix, so no app or client ID is hardcoded anywhere.
#
# Only the DEFINITION is created. No product values are written, so every
# existing product stays unset and keeps showing the widget.
#
# access.admin = merchant_read_write lets merchants toggle it per product in the
# Shopify admin. access.storefront is deliberately omitted: the theme app
# extension reads this in Liquid, and Liquid can always read metafields
# regardless of the Storefront API setting.
[product.metafields.app.hide_homexperia]
name = "Hide Homexperia"
description = "Enable this to hide Homexperia Room Visualisation on this product."
type = "boolean"
access.admin = "merchant_read_write"
