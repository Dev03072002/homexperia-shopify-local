name: Deploy AWS backend

# Builds the application container and pushes it to Amazon ECR, then triggers a
# rolling deploy on the AWS runtime.
#
# Authentication uses GitHub OIDC, so no long-lived AWS keys are stored in
# GitHub. The client creates an IAM role that trusts this repository.
#
# Database migrations are NOT run here. The container runs `prisma migrate
# deploy` on start (npm run docker-start), because RDS normally sits in a
# private subnet that GitHub runners cannot reach. Prisma takes an advisory lock,
# so concurrent task starts are safe.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two backend deploys race each other.
  group: deploy-aws-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  build-and-push:
    name: Build image and push to ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
          echo "uri=$REGISTRY/$REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Roll out to AWS
    needs: build-and-push
    runs-on: ubuntu-latest
    # Skipped until the client tells us which runtime they use. Pushing the
    # image above already works without this; only this job changes.
    if: vars.AWS_RUNTIME != ''

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ECS: the task definition points at the :latest tag, so forcing a new
      # deployment pulls the image just pushed.
      - name: Deploy to ECS
        if: vars.AWS_RUNTIME == 'ecs'
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      # App Runner: deployment is triggered on the service itself.
      - name: Deploy to App Runner
        if: vars.AWS_RUNTIME == 'apprunner'
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ vars.APPRUNNER_SERVICE_ARN }}"

      - name: Unsupported runtime
        if: vars.AWS_RUNTIME != 'ecs' && vars.AWS_RUNTIME != 'apprunner'
        run: |
          echo "AWS_RUNTIME='${{ vars.AWS_RUNTIME }}' is not handled by this workflow."
          echo "The image was built and pushed successfully; add a rollout step for this runtime."
          exit 1
