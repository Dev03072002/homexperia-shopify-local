name: Deploy Shopify extension

# Publishes a new app version to Shopify: the theme app extension asset and the
# app configuration in shopify.app.toml.
#
# This is deliberately NOT triggered by every push to main. Releasing an app
# version replaces the active version for every merchant with the app installed,
# so it is driven by publishing a GitHub Release, or run manually.
#
# The AWS backend deploys separately (deploy-aws-backend.yml) because the
# extension is hosted by Shopify's CDN and the backend runs on AWS.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: Release the new version to merchants immediately
        type: boolean
        default: true

jobs:
  deploy:
    name: Build asset and deploy to Shopify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # HOMEXPERIA_TARGET_URL is compiled into homexperia.min.js here. This is
      # the only place it takes effect — it is not an AWS runtime variable.
      # The build aborts if the URL cannot be injected or is not present in the
      # minified output, so a stale target URL cannot be published.
      - name: Build extension asset
        run: npm run build:extension
        env:
          HOMEXPERIA_TARGET_URL: ${{ vars.HOMEXPERIA_TARGET_URL }}

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      # --allow-updates is required because include_config_on_deploy is true, so
      # the deploy also pushes app configuration (scopes, URLs, webhooks).
      # --no-release creates the version without serving it to merchants.
      - name: Deploy to Shopify
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" != "true" ]; then
            shopify app deploy --allow-updates --no-release --source-control-url "$COMMIT_URL"
          else
            shopify app deploy --allow-updates --source-control-url "$COMMIT_URL"
          fi
